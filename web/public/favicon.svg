<!--
  GRM IDE 파비콘.

  16px에서도 읽혀야 하니 글자를 쓰지 않는다. 이 도구가 하는 일은 "지운 줄과
  더한 줄을 보여주는 것"이라, 그걸 그대로 그렸다 — 위는 지운 줄(빨강, 짧다),
  아래는 더한 줄(초록, 길다). 길이를 다르게 둔 것이 "바뀌었다"로 읽힌다.

  색은 앱과 같은 iOS 시스템 컬러이고, 바탕도 앱의 캔버스 색이다.
  어두운 탭 바에서 사각형이 사라지지 않도록 테두리를 한 겹 둔다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#0b0b0d" />
  <rect
    x="1"
    y="1"
    width="30"
    height="30"
    rx="8"
    fill="none"
    stroke="rgba(235,235,245,0.3)"
    stroke-width="1.25"
  />
  <!-- 16px에서 뭉개지지 않도록 두께와 여백을 잡았다 (막대 5.5 / 사이 간격 4) -->
  <rect x="6.5" y="8.5" width="12" height="5.5" rx="2.75" fill="#ff453a" />
  <rect x="6.5" y="18" width="19" height="5.5" rx="2.75" fill="#30d158" />
</svg>
